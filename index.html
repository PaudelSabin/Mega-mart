<!doctype html>
<!-- MegaMart: the single HTML page. Vite injects the React app into #root. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The design is a fixed 1440px-wide frame from Figma. -->
    <meta name="viewport" content="width=1440" />
    <title>MegaMart</title>
  </head>
  <body>
    <!-- React renders the whole homepage inside this element -->
    <div id="root"></div>
    <!-- Entry point of the app (see src/main.tsx) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
